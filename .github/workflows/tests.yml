name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'
      SERVERPOD_PASSWORD_database: 'dzkRlbEYV5W_xx4tv6op00JapUk_wvgX'
      SERVERPOD_PASSWORD_redis: 't8N1v-yrSok2I565hJWSTwXspE9EAWhu'
      # Test-only builder worker token (CI mirror of passwords.yaml test
      # section; guards nothing of value).
      SERVERPOD_PASSWORD_builderToken: '91c5a5f2e87028b59992961e1f8b432e5aced874e3f2c70bd0c562713f37cf85'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: apploop_server
        run: serverpod generate

      - name: Run tests
        working-directory: apploop_server
        run: dart test

      - name: Run Flutter widget tests
        working-directory: apploop_flutter
        run: flutter test
